services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sensory-synthesizer-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./data/processed/sensory_synthesizer.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./ml/saved_models:/app/ml/saved_models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: sensory-synthesizer-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: sensory-network

